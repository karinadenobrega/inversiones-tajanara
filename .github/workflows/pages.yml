name: Publicar tarjeta de contacto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático e imágenes
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64, shutil
          output = Path('_site')
          output.mkdir(exist_ok=True)
          for name in ('index.html', 'tarjeta-karina-tajanara-qr.svg'):
              shutil.copyfile(name, output / name)
          # Imágenes PNG optimizadas, incluidas para una publicación reproducible.
          assets = {"compartir-logo.png": "", "tarjeta-karina-tajanara.png": ""}
          for name, encoded in assets.items():
              (output / name).write_bytes(base64.b64decode(encoded, validate=True))
          (output / '.nojekyll').touch()
          PYTHON
      - name: Cargar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
