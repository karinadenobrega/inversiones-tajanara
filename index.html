      <button id="copy-link" class="action" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 1 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 0)"/></svg>Copiar enlace</button>
      <a id="download-qr" class="action secondary" href="./tarjeta-karina-tajanara-qr.svg" download="tarjeta-karina-tajanara-qr.svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>Descargar QR</a>
    </div>
    <p id="share-feedback" class="feedback" role="status" aria-live="polite"></p>
    <p id="share-url" class="share-url" tabindex="0"></p>
  </dialog>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    const phones = [
      { label: 'WhatsApp 1', display: '+58 0414 125 0363', number: '+584141250363' },
      { label: 'WhatsApp 2', display: '+58 0412 442 5262', number: '+584124425262' }
    ];
    const dialog = document.querySelector('dialog');
    const feedback = document.querySelector('#dialog-feedback');
    const toast = document.querySelector('.toast');
    let selected = phones[0];
    let toastTimer;
    function notify(message) { clearTimeout(toastTimer); toast.textContent = message; toastTimer = setTimeout(() => { toast.textContent = ''; }, 3500); }
    async function copy(value) {
      try { await navigator.clipboard.writeText(value); return true; }
      catch {
        const field = document.createElement('textarea');
        field.value = value; field.setAttribute('readonly', ''); field.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
        (document.querySelector('dialog[open]') || document.body).append(field);
        const previousFocus = document.activeElement;
        field.focus(); field.select(); field.setSelectionRange(0, value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); } catch {}
        field.remove(); previousFocus?.focus();
        return copied;
      }
    }
    document.querySelectorAll('.phone').forEach(button => button.addEventListener('click', () => {
      selected = phones[Number(button.dataset.index)];
      document.querySelector('#dialog-title').textContent = selected.label;
      document.querySelector('#dialog-number').textContent = selected.display;
      document.querySelector('#whatsapp-link').href = 'https://wa.me/' + selected.number.slice(1);
      feedback.textContent = '';
      dialog.showModal();
    }));
    document.querySelector('.close').addEventListener('click', () => dialog.close());
    document.querySelectorAll('dialog').forEach(modal => modal.addEventListener('click', event => {
      if (event.target !== modal) return;
      const bounds = modal.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) modal.close();
    }));
    document.querySelector('#copy-phone').addEventListener('click', async () => {
      feedback.textContent = await copy(selected.number) ? 'Número copiado.' : 'Mantén pulsado el número de arriba para copiarlo.';
    });
    document.querySelector('.copy-email').addEventListener('click', async () => {
      notify(await copy('karina@tajanara2020.com') ? 'Correo electrónico copiado.' : 'Mantén pulsado el correo electrónico para copiarlo.');
    });

    const shareDialog = document.querySelector('#share-options');
    const shareFeedback = document.querySelector('#share-feedback');
    const shareUrl = document.querySelector('#share-url');
    const contactCardUrl = 'https://karinadenobrega.github.io/inversiones-tajanara/';
    document.querySelector('.share-button').addEventListener('click', () => {
      shareFeedback.textContent = '';
      shareUrl.textContent = '';
      shareDialog.showModal();
    });
    document.querySelector('.share-close').addEventListener('click', () => shareDialog.close());
    document.querySelector('#copy-link').addEventListener('click', async () => {
      const copied = await copy(contactCardUrl);
      shareFeedback.textContent = copied ? 'Enlace copiado.' : 'Mantén pulsado el enlace para copiarlo.';
      shareUrl.textContent = copied ? '' : contactCardUrl;
    });
  </script>
</body>
