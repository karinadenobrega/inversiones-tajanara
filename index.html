  <style>

    .contact:hover{background:var(--soft);border-color:#9bb5cc}.icon{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue)}.icon svg{width:23px;height:23px}.details{min-width:0;display:grid;gap:5px}.label{font-size:.875rem;color:var(--muted)}.value{font-size:1.0625rem;font-weight:600;letter-spacing:.005em}.dots{margin-left:auto;color:#8798a8;font-weight:700;font-size:1.25rem;letter-spacing:2px}
    .email{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;overflow:visible}.email .contact{border:0;flex:1;min-width:0;text-decoration:none;border-radius:14px 0 0 14px;padding-right:0}.email .value{font-size:1rem;letter-spacing:0;overflow-wrap:anywhere}.copy-email{display:grid;place-items:center;align-self:stretch;width:44px;flex:0 0 44px;border:0;background:transparent;color:var(--muted);border-radius:0 14px 14px 0}.copy-email:hover{background:var(--soft);color:var(--blue)}.copy-email svg{width:18px;height:18px}

    @media(max-width:520px){body{padding:0;background:#fff;display:block}.card{border:0;border-radius:0;box-shadow:none;max-width:460px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}.brand svg{width:250px}.rule{margin-top:25px;margin-bottom:25px}.identity{margin-bottom:27px}h1{font-size:1.75rem}}

  <script>
    const phones = [
      { label: 'WhatsApp 1', display: '+58 0414 125 0363', number: '+584141250363' },
      { label: 'WhatsApp 2', display: '+58 0412 442 5262', number: '+584124425262' }
    ];
    const dialog = document.querySelector('dialog');
    const feedback = document.querySelector('#dialog-feedback');
    const toast = document.querySelector('.toast');
    let selected = phones[0];
    let toastTimer;
    function notify(message) { clearTimeout(toastTimer); toast.textContent = message; toastTimer = setTimeout(() => { toast.textContent = ''; }, 3500); }
    async function copy(value) {
      try { await navigator.clipboard.writeText(value); return true; }
      catch {
        const field = document.createElement('textarea');
        field.value = value; field.setAttribute('readonly', ''); field.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
        (dialog.open ? dialog : document.body).append(field);
        const previousFocus = document.activeElement;
        field.focus(); field.select(); field.setSelectionRange(0, value.length);
        let copied = false;
        try { copied = document.execCommand('copy'); } catch {}
        field.remove(); previousFocus?.focus();
        return copied;
      }
    }
    document.querySelectorAll('.phone').forEach(button => button.addEventListener('click', () => {
      selected = phones[Number(button.dataset.index)];
      document.querySelector('#dialog-title').textContent = selected.label;
      document.querySelector('#dialog-number').textContent = selected.display;
      document.querySelector('#whatsapp-link').href = 'https://wa.me/' + selected.number.slice(1);
      feedback.textContent = '';
      dialog.showModal();
    }));
    document.querySelector('.close').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target !== dialog) return;
      const bounds = dialog.getBoundingClientRect();
      if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
    });
    document.querySelector('#copy-phone').addEventListener('click', async () => {
      feedback.textContent = await copy(selected.number) ? 'Número copiado.' : 'Mantén pulsado el número de arriba para copiarlo.';
    });
    document.querySelector('.copy-email').addEventListener('click', async () => {
      notify(await copy('karina@tajanara2020.com') ? 'Correo electrónico copiado.' : 'Mantén pulsado el correo electrónico para copiarlo.');
    });
  </script>
